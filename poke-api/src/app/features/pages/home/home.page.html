<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>PokeDex</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar>
          <ion-title>Todos os Pokémon</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <app-poke-list
          [pokemons]="allLoadedPokemons"
          [hasMore]="hasMorePokemons"
          (pokemonSelected)="onPokemonSelected($event)"
          (loadMore)="loadMorePokemonData($event)">
        </app-poke-list>
        <div *ngIf="!allLoadedPokemons.length && !isLoading" class="ion-text-center ion-padding">
          <p>Nenhum Pokémon na lista lateral. Verifique sua conexão.</p>
        </div>
      </ion-content>
    </ion-menu>

    <div class="ion-page" id="main-content">
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
          </ion-buttons>
          <ion-title>PokeDex Principal</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <div class="ion-padding">
          <h2 class="ion-text-center">Pokédex</h2>

          <div *ngIf="isLoading && !allLoadedPokemons.length" class="ion-text-center ion-padding">
            <ion-spinner name="bubbles"></ion-spinner>
            <p>Carregando Pokémon...</p>
          </div>

          <app-poke-grid
            [pokemons]="allLoadedPokemons"
            [hasMore]="hasMorePokemons"
            (loadMore)="loadMorePokemonData($event)">
          </app-poke-grid>

          <div *ngIf="!allLoadedPokemons.length && !isLoading" class="ion-text-center ion-padding">
            <p>Nenhum Pokémon carregado na grade. Verifique sua conexão ou tente novamente.</p>
          </div>

          
        </div>
      </ion-content>
    </div>
  </ion-split-pane>
</ion-content>
