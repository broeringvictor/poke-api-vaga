<ion-list>

  <ion-item *ngFor="let pokemon of pokemons; trackBy: pokemon?.id" (click)="selectPokemon(pokemon.name)">
    <ion-avatar slot="start">
      <!-- Sprite em miniatura -->
      <img [src]="pokemon.sprites.front_default" alt="{{ pokemon.name }}">
    </ion-avatar>
    <ion-label>{{ pokemon.name | titlecase }}</ion-label>
  </ion-item>
</ion-list>


<ion-infinite-scroll (ionInfinite)="onLoadMore($event)" [disabled]="!hasMore">
  <ion-infinite-scroll-content
    loadingSpinner="dots"
    loadingText="Carregando mais Pokémon...">
  </ion-infinite-scroll-content>
</ion-infinite-scroll>
