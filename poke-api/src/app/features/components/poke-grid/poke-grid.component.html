<ion-grid>
  <ion-row>

    <ion-col size="12" size-md="6" size-lg="4" *ngFor="let pokemon of pokemons; trackBy: pokemon?.id">
      <ion-card (click)="selectPokemon(pokemon.name)">
        <ion-card-header>
          <ion-card-title class="ion-text-center">{{ pokemon.name | titlecase }}</ion-card-title>
        </ion-card-header>
        <ion-card-content class="ion-text-center">

          <img [src]="pokemon.sprites.other?.['official-artwork']?.front_default || pokemon.sprites.front_default"
               alt="{{ pokemon.name }}"
               class="pokemon-grid-image">
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>
</ion-grid>


<ion-infinite-scroll (ionInfinite)="onLoadMore($event)" [disabled]="!hasMore">
  <ion-infinite-scroll-content
    loadingSpinner="bubbles"
    loadingText="Carregando mais Pokémon...">
  </ion-infinite-scroll-content>
</ion-infinite-scroll>
